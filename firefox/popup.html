<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Edgar++</title>
<style>
  :root { color-scheme:dark; font:14px system-ui,sans-serif; background:#1d141a; color:#fff4f7 }
  body { width:320px; max-width:100vw; margin:0 }
  main { padding:14px }
  header { display:flex; align-items:center; gap:10px; margin-bottom:12px }
  header img { width:36px; height:36px }
  h1 { font-size:20px; margin:0 }
  #version { margin-inline-start:auto; color:#d9beca; font-size:12px }
  section { margin-top:10px; padding:0 10px; background:#2c1e26; border:1px solid #503440; border-radius:8px }
  h2 { margin:8px 0 2px; font-size:12px; color:#d9beca }
  .setting { display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:34px; padding:2px 0; cursor:pointer }
  .setting + .setting { border-top:1px solid #503440 }
  main > .setting { padding:2px 10px; background:#372430; border-radius:8px }
  input { flex:none; width:18px; height:18px; margin:0; accent-color:#e897b3 }
  #sync-help { margin:2px 0 8px; color:#d9beca; font-size:12px; line-height:1.45 }
  button, .reference { display:block; box-sizing:border-box; width:100%; padding:7px; text-align:center; color:inherit; background:#4e2a3b; border:1px solid #a77589; border-radius:6px; font:inherit; cursor:pointer }
  button { margin-bottom:8px }
  .reference { margin-top:10px; text-decoration:none }
  button[hidden] { display:none }
  :focus-visible { outline:2px solid #ffc1d6; outline-offset:2px }
  #status { white-space:pre-wrap; margin:8px 0 0 }
  #status:empty { display:none }
</style>
</head>
<body>
<main>
  <header><img src="edgar-icon.svg" alt=""><h1>Edgar++</h1><span id="version"></span></header>
  <label class="setting">Edgar++ uključen <input id="enabled" type="checkbox" disabled></label>
  <div id="features">
    <section aria-labelledby="display-heading">
      <h2 id="display-heading">Prikaz</h2>
      <label class="setting">Burgundy tema <input id="burgundy" type="checkbox" disabled></label>
      <label class="setting">Prikaži razmake kao točke <input id="space-marks" type="checkbox" disabled></label>
      <label class="setting">Novi red kao \n umjesto ↵ <input id="newline-marks" type="checkbox" disabled></label>
    </section>
    <section aria-labelledby="privacy-heading">
      <h2 id="privacy-heading">Privatnost</h2>
      <label class="setting">Sakrij osobne podatke <input id="privacy" type="checkbox"></label>
    </section>
    <section aria-labelledby="sync-heading">
      <h2 id="sync-heading">VS Code</h2>
      <label class="setting">Omogući povezivanje <input id="sync" type="checkbox" disabled></label>
      <p id="sync-help" hidden>Na Edgarovoj stranici klikni <b>VS Code · Spoji</b>.</p>
      <button id="stop" type="button" hidden>Odspoji VS Code</button>
    </section>
    <a class="reference" href="upro-reference.html" target="_blank" rel="noopener">Otvori UPRO prečace</a>
  </div>
  <p id="status" role="status"></p>
</main>
<script src="popup.js"></script>
</body>
</html>
